<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 12-In lịch</title>
    <link rel="stylesheet" href="bai12.css" />
  </head>
  <body class="nen-trang">
    <main class="the-lich-chinh">
      <section class="o-lich">
        <p id="hien-thi-nam" class="chu-do-nho">2026</p>
        <h2 id="hien-thi-thang" class="chu-xanh-vua">Tháng 12</h2>
        <div id="hien-thi-ngay" class="chu-do-lon">24</div>
        <p id="hien-thi-thu" class="chu-xanh-vua">Thứ hai</p>
      </section>

      <p id="hien-thi-loi-chao" class="loi-chao-nghieng">Chào buổi sáng!</p>

      <form class="khung-nhap-lieu">
        <div class="nhom-nhap">
          <label for="nhap-ngay">Ngày</label>
          <input type="number" id="nhap-ngay" value="24" min="1" max="31" />
        </div>
        <div class="nhom-nhap">
          <label for="nhap-thang">Tháng</label>
          <input type="number" id="nhap-thang" value="12" min="1" max="12" />
        </div>

        <div class="nhom-nhap">
          <label for="nhap-nam">Năm</label>
          <input type="number" id="nhap-nam" value="2026" min="1900" />
        </div>

        <button type="button" id="nut-in-lich" class="nut-bam">In lịch</button>
      </form>
    </main>

    <script src="bai12.js"></script>
  </body>
</html>
