<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thư Viện Ảnh - Hiệu Ứng Hover</title>
    <link rel="stylesheet" href="bai23.css" />
  </head>
  <body class="nen-trang">
    <main class="trang-thu-vien">
      <header class="tieu-de-trang">
        <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
        <p>
          Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú
          thích.
        </p>
      </header>

      <section class="luoi-anh">
        <div class="o-anh">
          <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Vịnh Hạ Long</span>
          </div>
        </div>

        <div class="o-anh">
          <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Hang Sơn Đoòng</span>
          </div>
        </div>

        <div class="o-anh">
          <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Thác Bản Giốc</span>
          </div>
        </div>

        <div class="o-anh">
          <img src="4-fansipan.jpg" alt="Fansipan" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Fansipan</span>
          </div>
        </div>
        <div class="o-anh">
          <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Đồng bằng sông Cửu Long</span>
          </div>
        </div>
        <div class="o-anh">
          <img src="6-phong-nha.jpg" alt="Động Phong Nha" />
          <div class="lop-phu-chu-thich">
            <span class="ten-dia-danh">Động Phong Nha</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
