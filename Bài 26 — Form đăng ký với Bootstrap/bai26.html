<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 26-Form đăng ký với bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="bai26.css" />
  </head>
  <body
    class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3"
  >
    <div class="card khung-form shadow border-0">
      <div class="card-header bg-success text-white text-center py-3">
        <h3 class="card-title mb-0 fw-bold">
          Đăng ký tham gia CLB Lập trình Web
        </h3>
      </div>

      <div class="card-body p-4 p-md-5">
        <form action="#" method="POST">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="hoTen" class="form-label fw-semibold"
                >Họ và tên</label
              >
              <input
                type="text"
                class="form-control"
                id="hoTen"
                placeholder="Nguyễn Văn A"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="maSV" class="form-label fw-semibold"
                >Mã sinh viên</label
              >
              <input
                type="text"
                class="form-control"
                id="maSV"
                placeholder="22xxxxxx"
                required
              />
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="sv@tlu.edu.vn"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="soDienThoai" class="form-label fw-semibold"
                >Số điện thoại</label
              >
              <input
                type="tel"
                class="form-control"
                id="soDienThoai"
                placeholder="09xxxxxxxx"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold d-block">Trình độ</label>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="trinhDo"
                id="trinhDoCoBan"
                value="coban"
                checked
              />
              <label class="form-check-label" for="trinhDoCoBan">Cơ bản</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="trinhDo"
                id="trinhDoKha"
                value="kha"
              />
              <label class="form-check-label" for="trinhDoKha">Khá</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="trinhDo"
                id="trinhDoTot"
                value="tot"
              />
              <label class="form-check-label" for="trinhDoTot">Tốt</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="chonLop" class="form-label fw-semibold">Chọn lớp</label>
            <select class="form-select" id="chonLop" required>
              <option value="67CNTT1" selected>67CNTT1</option>
              <option value="67CNTT2">67CNTT2</option>
              <option value="67KTPM1">67KTPM1</option>
              <option value="67KTPM2">67KTPM2</option>
            </select>
          </div>
          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="camKet"
              required
            />
            <label class="form-check-label fw-semibold" for="camKet">
              Tôi cam kết tự làm bài(có sự giúp đỡ của AI) và quay video OBS
            </label>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="reset" class="btn btn-outline-secondary px-4">
              Nhập lại
            </button>
            <button type="submit" class="btn btn-success px-4">Đăng ký</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
