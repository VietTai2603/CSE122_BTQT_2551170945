<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 30 — Bảng điều khiển (Bootstrap)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f0f2f5;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      .sidebar {
        width: 230px;
        background-color: #212529;
        min-height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
      }

      /* Khu vực nội dung chính đẩy sang phải để tránh bị sidebar che */
      .main-content {
        margin-left: 230px;
        padding: 30px;
      }

      /* Tùy chỉnh liên kết menu trong sidebar */
      .sidebar .nav-link {
        color: #adb5bd;
        padding: 12px 20px;
        border-radius: 8px;
        margin-bottom: 5px;
        font-size: 15px;
      }

      .sidebar .nav-link:hover {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.05);
      }

      .sidebar .nav-link.active {
        color: #ffffff;
        background-color: #0d6efd;
        font-weight: bold;
      }

      /* Tùy chỉnh thẻ thống kê (Card) */
      .card-thong-ke {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        transition: transform 0.2s;
      }

      .card-thong-ke:hover {
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <!-- 1. SIDEBAR MENU DỌC BÊN TRÁI -->
    <aside class="sidebar d-flex flex-column p-3">
      <!-- Thương hiệu / Tiêu đề hệ thống -->
      <a
        href="#"
        class="text-white text-decoration-none fw-bold fs-5 px-2 mb-4 mt-2"
      >
        CSE.TLU Admin
      </a>

      <!-- Danh sách các mục menu -->
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="#" class="nav-link active" aria-current="page"
            >Bảng điều khiển</a
          >
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Bài tập</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Sinh viên</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Điểm số</a>
        </li>
      </ul>
    </aside>

    <!-- 2. KHU VỰC NỘI DUNG CHÍNH BÊN PHẢI (MAIN CONTENT) -->
    <main class="main-content">
      <!-- TIÊU ĐỀ TRANG VÀ CÁC NÚT THao TÁC PHÍA TRÊN -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold mb-0">Bảng điều khiển</h2>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-warning text-dark px-3 py-2 fw-semibold fs-6"
            >3 bài mới</span
          >
          <button class="btn btn-primary px-3 py-2 fw-semibold">
            Xuất báo cáo
          </button>
        </div>
      </div>

      <!-- 3. HỆ THỐNG 4 THẺ THỐNG KÊ (GRID 4 CỘT) -->
      <div class="row g-4 mb-4">
        <!-- Thẻ 1: Sinh viên -->
        <div class="col-sm-6 col-xl-3">
          <div class="card card-thong-ke p-3 h-100">
            <span class="text-muted fs-6 mb-1">Sinh viên</span>
            <h3 class="fw-bold fs-2 mb-3 text-dark">128</h3>
            <!-- Thanh tiến độ nhỏ -->
            <div class="progress" style="height: 4px">
              <div
                class="progress-bar bg-primary"
                role="progressbar"
                style="width: 80%"
                aria-valuenow="80"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>

        <!-- Thẻ 2: Đã nộp -->
        <div class="col-sm-6 col-xl-3">
          <div class="card card-thong-ke p-3 h-100">
            <span class="text-muted fs-6 mb-1">Đã nộp</span>
            <h3 class="fw-bold fs-2 mb-3 text-dark">96</h3>
            <div class="progress" style="height: 4px">
              <div
                class="progress-bar bg-success"
                role="progressbar"
                style="width: 75%"
                aria-valuenow="75"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>

        <!-- Thẻ 3: Chưa nộp -->
        <div class="col-sm-6 col-xl-3">
          <div class="card card-thong-ke p-3 h-100">
            <span class="text-muted fs-6 mb-1">Chưa nộp</span>
            <h3 class="fw-bold fs-2 mb-3 text-dark">32</h3>
            <div class="progress" style="height: 4px">
              <div
                class="progress-bar bg-danger"
                role="progressbar"
                style="width: 25%"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>

        <!-- Thẻ 4: Điểm TB -->
        <div class="col-sm-6 col-xl-3">
          <div class="card card-thong-ke p-3 h-100">
            <span class="text-muted fs-6 mb-1">Điểm TB</span>
            <h3 class="fw-bold fs-2 mb-3 text-dark">7.8</h3>
            <div class="progress" style="height: 4px">
              <div
                class="progress-bar bg-warning"
                role="progressbar"
                style="width: 78%"
                aria-valuenow="78"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. DANH SÁCH TIẾN ĐỘ THEO CHƯƠNG (CARD CHỨA DANH SÁCH) -->
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
          <h5 class="fw-bold mb-0 text-dark">Tiến độ theo chương</h5>
        </div>

        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            <!-- Chương 1 -->
            <li
              class="list-group-item d-flex justify-content-between align-items-center py-3 px-4"
            >
              <span class="fw-medium text-secondary">Chương 1 — HTML5</span>
              <span class="badge bg-success px-3 py-2 fs-6">100%</span>
            </li>

            <!-- Chương 2 -->
            <li
              class="list-group-item d-flex justify-content-between align-items-center py-3 px-4"
            >
              <span class="fw-medium text-secondary"
                >Chương 2 — JavaScript</span
              >
              <span class="badge bg-info px-3 py-2 fs-6">82%</span>
            </li>

            <!-- Chương 3 -->
            <li
              class="list-group-item d-flex justify-content-between align-items-center py-3 px-4"
            >
              <span class="fw-medium text-secondary">Chương 3 — CSS3</span>
              <span class="badge bg-info px-3 py-2 fs-6">74%</span>
            </li>

            <!-- Chương 4 -->
            <li
              class="list-group-item d-flex justify-content-between align-items-center py-3 px-4"
            >
              <span class="fw-medium text-secondary"
                >Chương 4 — Bootstrap 5</span
              >
              <span class="badge bg-secondary px-3 py-2 fs-6">45%</span>
            </li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Nhúng Bootstrap 5 JS Bundle qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
