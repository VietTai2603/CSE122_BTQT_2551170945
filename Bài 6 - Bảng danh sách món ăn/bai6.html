<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="bai6.css" />
  </head>
  <body>
    <div class="khung-chua">
      <h2 class="tieu-de">Các món ngon Hà Nội</h2>
      <div class="bo-cuc">
        <div class="cot-anh">
          <img src="Bat.gif" alt="Ảnh minh hoa món ăn" class="anh-minhhoa" />
        </div>
        <div class="cot-bang">
          <table class="bang-mon">
            <thead>
              <tr>
                <th class="cot-stt">STT</th>
                <th class="cot-ten">Tên món ăn</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="can-giua">1</td>
                <td>Bánh cuốn Thanh Trì</td>
              </tr>
              <tr>
                <td class="can-giua">2</td>
                <td>Xôi Hà Nội</td>
              </tr>
              <tr>
                <td class="can-giua">3</td>
                <td>Chả cá Lã Vọng</td>
              </tr>
              <tr>
                <td class="can-giua">4</td>
                <td>Cháo Cóc</td>
              </tr>
              <tr>
                <td class="can-giua">5</td>
                <td>Bánh Gai Ninh Giang</td>
              </tr>
              <tr>
                <td class="can-giua">6</td>
                <td>Bún Thang Hà Nội</td>
              </tr>
              <tr>
                <td class="can-giua">7</td>
                <td>Canh Lằng</td>
              </tr>
              <tr>
                <td class="can-giua">8</td>
                <td>Vịt quay Lạng Sơn</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
